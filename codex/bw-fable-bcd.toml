id = "bw-fable-bcd"
title = "Fable B/C/D existence probes: one CUDA build (K9-fix MMQ PDL substrate + prefetch-above-pdl_sync variants), test-fable-bcd on CUDA1 and CUDA0: B L2 prefetch vs cold, C pre-wait weight prefetch in MMVQ/MMQ chains, D GDN K=6 vs K=1 snapshot writes"
kind = "filler"
priority = 16
host_sensitive = false
preemptible = false
# G: 2700 s = one cold CUDA build of ggml-cuda + one test target (~700-1500 s in bw-k9 a1, ccache may help; buildgate -j4)
# + 3 driver runs (CUDA1, nopdl diagnostic, CUDA0) at ~5-10 min each (B 8 cfg x 9 arms x 7 rounds x 400 reps of ~50 us; C 12 cfg x 6 arms x 7 rounds x 60-120 reps of a 48-link graph; D 4 cfg x 4 arms x 7 rounds x 60-120 reps).
# D: 5400 s budget = 2x est (cold build at the top of the range plus slow runs).
est_s = 2700
budget_s = 5400
ab = false
retry = "never"
exit_codes = { "3" = "hazard", "4" = "transient", "5" = "insufficient_data", "6" = "integrity", "7" = "timeout", "8" = "deterministic" }
signatures = [{ class = "deterministic", regex = "bw-fable-bcd: FAIL" }]

