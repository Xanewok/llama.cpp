id = "host-bundle-depth-ab"
title = "Host bundle vs 98c695111, CCCL 3.4.3 in both arms; Swift 1.5 IQ4_XS TP2 np1 k=5, steady full-K ms/round at 8k/32k/90k; cross-arm identity"
# up patch patch up: 4 x 350 s x 1.5 + 150 = run 2250; + canary 600 + cleanup 150 = 3000.
# cpu_evidence: CUDA_VISIBLE_DEVICES='' nice -n 19 python3 codex/host_bundle_parsers.py
kind = "measure"
ab = true
retry = "fresh"
budget_s = 3000
est_s = 1800
startup_grace_s = 300
exit_codes = { "3" = "hazard", "4" = "transient", "5" = "insufficient_data", "6" = "integrity", "7" = "timeout", "8" = "deterministic" }
signatures = [
  { class = "hazard", regex = "\\bXid\\b|fallen off the bus" },
  { class = "integrity", regex = "frozen bytes changed|inputs changed|model SHA changed|effective params mismatch|frozen file set changed|cross-arm identity failed|path-engaged proof failed|staging-engaged proof failed|canary prompt differs" },
  { class = "insufficient_data", regex = "too few verify steps|proof inconclusive|missing final token identity|canary prompt has \\d+ tokens|reached only \\d+ cached|R2 reused only" },
]

[run]
cmd = ["bash", "/home/xanewok/repos/qwen38-eval/harness/run.sh", "depth", "/home/xanewok/repos/host-bundle/codex/host-bundle.experiment.toml", "--execute", "--out", "/home/xanewok/repos/host-bundle/codex/runs/host-bundle-depth-ab/full-a{attempt}", "--port", "{port}"]
cwd = "/home/xanewok/repos/qwen38-eval/harness"
env = { GPUQ_ACTIVE = "1" }
ports = "dynamic"

[preflight]
cmd = ["bash", "/home/xanewok/repos/qwen38-eval/harness/run.sh", "depth", "/home/xanewok/repos/host-bundle/codex/host-bundle.experiment.toml", "--preflight", "--out", "/home/xanewok/repos/host-bundle/codex/runs/host-bundle-depth-ab/preflight-plan"]
timeout_s = 180

[canary]
cmd = ["python3", "/home/xanewok/repos/host-bundle/codex/host_bundle_canary.py", "--canary", "--out", "/home/xanewok/repos/host-bundle/codex/runs/host-bundle-depth-ab/canary-a{attempt}", "--port", "{port}"]
env = { GPUQ_ACTIVE = "1" }
timeout_s = 600

[outputs]
paths = ["/home/xanewok/repos/host-bundle/codex/runs/host-bundle-depth-ab/full-a{attempt}"]

[fix]
editable = []
protected = ["identity", "steady_minimum", "SHA256SUMS", "frozen", "DEPTHS", "ARM_ENV", "engaged", "min_p"]

