cmd = ["bash", "/home/xanewok/repos/qwen38-eval-worktrees/work/aa-load/ccx01.sh", "bash", "/home/xanewok/repos/qwen38-eval-worktrees/work/build-window-1007/bw-run.sh", "/home/xanewok/repos/qwen38-eval-worktrees/wt/chain-m2/codex/m2/bw-chain-m2.sh", "/home/xanewok/repos/qwen38-eval-worktrees/work/build-window-1007/chain-m2-a{attempt}"]
