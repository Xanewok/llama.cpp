id = "bw-k9-fix"
title = "K9 fix (restrict kept, wait ordered by data): CUDA builds fix/stock/old-K9, SASS gate vs stock, byte identity, mutants, suites, perf base/k9old/fix/off"
kind = "filler"
priority = 18
host_sensitive = false
preemptible = false
# G: 6000 s; D: 12000 s cap covers three CUDA builds (two cold in /mnt/scratch, ~700 s each in bw-k9 a1), both-device gates
# (1288 s in a3), suites (116 s) and 14 perf runs (~73 s each in a3).
est_s = 6000
budget_s = 12000
ab = false
retry = "never"
exit_codes = { "3" = "hazard", "4" = "transient", "5" = "insufficient_data", "6" = "integrity", "7" = "timeout", "8" = "deterministic" }
signatures = [{ class = "deterministic", regex = "bw-k9-fix: FAIL" }]

[run]
cmd = ["/usr/bin/bash", "/home/xanewok/repos/qwen38-eval-worktrees/wt/k9-fix/codex/bw-k9-fix.sh", "/home/xanewok/repos/qwen38-eval-worktrees/wt/k9-fix/codex/window/k9fix-a{attempt}"]
