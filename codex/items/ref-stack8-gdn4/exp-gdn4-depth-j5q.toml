kind = "depth"
title = "stack8 + upstream #30087 (GDN four state columns per warp) vs stack8 np1: chain and fold on, J5q real prompts, 6 sampled texts per depth, ABBA"
# Lever: one kernel (ggml-cuda gated_delta_net.cu); warp_reduce_sum width 32 -> 8, so the reduction order changes and outputs are NOT bitwise stack8's.
# Expected (D): about -0.2 ms/round of ~39 ms (kernel ~0.63 ms/round; PR measured -12 % at n=1 to -33 % multi-token on a 4090); unmeasured on sm_120.
# Identity: "cross-arm" cannot hold (a changed sum order moves sampled tokens at temperature 1) and "off" is refused for one stream, so
# "within-arm": each arm must reproduce its own tokens and draft counters across its two boots (determinism of the new kernel, rc 6 otherwise).
# Cross-arm comparability is by acceptance: min_acceptance gates every text, and {arm}_acceptance_M / tokens_per_round_M are read next to ms/round.
# The 6 texts per depth are the sample unit (texts differ across arms, same prompt and seeds): read g4_minus_s8_stats (Welch/bootstrap over texts), not one text.
# Negative control: the boot-to-boot ms/round delta of the same arm (ABBA) is the noise floor; the numeric check of the kernel is gdn4-cuda-checks.
