id = "mmvq-np2-perf"
title = "Wide MMVQ perf: five types, TP2 projection shapes; memcheck must pass before perf"
# G estimates: memcheck 2 x 300 s <= 0.7 x 1200 s; perf 12 x 100 s <= 0.7 x 2400 s.
kind = "measure"
ab = true
retry = "fresh"
budget_s = 2850
est_s = 1400
startup_grace_s = 120
exit_codes = { "3" = "hazard", "4" = "transient", "5" = "insufficient_data", "6" = "integrity", "7" = "timeout", "8" = "deterministic" }
signatures = [
  { class = "integrity", regex = "probe: integrity" },
  { class = "timeout", regex = "probe: budget" }
]

[run]
cmd = ["python3", "/home/xanewok/repos/qwen38-eval-worktrees/wt/mmvq-np2/codex/kernel_item.py", "perf", "--stage", "run", "--out", "/home/xanewok/repos/qwen38-eval-worktrees/wt/mmvq-np2/codex/gpu-results/perf/full-a{attempt}", "--budget", "2400"]
cwd = "/home/xanewok/repos/qwen38-eval-worktrees/wt/mmvq-np2/codex"
env = { GPUQ_ACTIVE = "1", PYTHONDONTWRITEBYTECODE = "1" }
ports = []

[preflight]
cmd = ["python3", "/home/xanewok/repos/qwen38-eval-worktrees/wt/mmvq-np2/codex/kernel_item.py", "perf", "--stage", "preflight"]
timeout_s = 120

[canary]
cmd = ["python3", "/home/xanewok/repos/qwen38-eval-worktrees/wt/mmvq-np2/codex/kernel_item.py", "perf", "--stage", "canary", "--out", "/home/xanewok/repos/qwen38-eval-worktrees/wt/mmvq-np2/codex/gpu-results/perf/canary-a{attempt}", "--budget", "300"]
env = { GPUQ_ACTIVE = "1", PYTHONDONTWRITEBYTECODE = "1" }
timeout_s = 300

[outputs]
paths = ["/home/xanewok/repos/qwen38-eval-worktrees/wt/mmvq-np2/codex/gpu-results/perf/full-a{attempt}"]

[fix]
editable = []
protected = ["frozen", "budget", "coverage", "correctness", "memcheck_first"]

