id = "graph-reuse-tandem"
title = "Swift MTP K=5/K=3: up vs prefill-fixed graph reuse vs graph reuse with owned input staging"
kind = "measure"
ab = true
retry = "fresh"
budget_s = 4200
est_s = 2596
startup_grace_s = 90
signatures = [
  { class = "hazard", regex = "Xid|fallen off" },
  { class = "timeout", regex = "queue wall budget" },
  { class = "integrity", regex = "identity failed|frozen.*changed|inputs changed|model SHA changed|counter identity" },
  { class = "insufficient_data", regex = "insufficient steady|generated fewer|did not stream|missing authoritative rounds" },
  { class = "deterministic", regex = "boot validation failed|counters disagree|cold request reused" },
]

[run]
cmd = ["bash", "/home/xanewok/repos/graph-reuse/codex/gpu_ab.sh", "--execute", "--k", "both", "--budget", "3600", "--port", "8398", "--out", "/home/xanewok/repos/graph-reuse/codex/runs/graph-reuse-tandem/full-a{attempt}"]
cwd = "/home/xanewok/repos/graph-reuse"
env = { RUN_GPU = "1" }
ports = [8398]

[preflight]
cmd = ["bash", "/home/xanewok/repos/graph-reuse/codex/gpu_ab.sh", "--k", "both", "--budget", "3600"]
timeout_s = 120
env = {}

[canary]
