id = "draft-attn-1row-ab3"
title = "One-row FLASH_ATTN_EXT: frozen base vs smaller MMA tiles, TP2 shapes at 8k/32k/90k, correctness and effective bandwidth"
kind = "measure"
budget_s = 900
est_s = 240
# Low priority: Codex predicts unchanged time (kernel at ~93 % of bandwidth); runs after the MMVQ items.
priority = 40
ab = true
retry = "fresh"
exit_codes = { "3" = "hazard", "4" = "transient", "5" = "insufficient_data", "6" = "integrity", "7" = "timeout", "8" = "deterministic" }
signatures = [
    { class = "hazard", regex = "\\bXid\\b|fallen off the bus" },
    { class = "integrity", regex = "frozen bytes changed|ggml libs resolve outside frozen dir|FA source shape mismatch" },
    { class = "timeout", regex = "budget expired" },
]

[run]
cmd = ["bash", "/home/xanewok/repos/draft-attn/codex/draft-attn-probe3/run.sh", "--run"]
cwd = "/home/xanewok/repos/draft-attn"
env = { CUDA_VISIBLE_DEVICES = "0,1", BUDGET_S = "600", OUT = "/home/xanewok/repos/draft-attn/codex/runs/draft-attn-ab3/full-a{attempt}" }
ports = []

[preflight]
cmd = ["bash", "/home/xanewok/repos/draft-attn/codex/draft-attn-probe3/run.sh", "--preflight"]
env = { CUDA_VISIBLE_DEVICES = "", OUT = "/home/xanewok/repos/draft-attn/codex/runs/draft-attn-ab3/preflight" }
timeout_s = 60

[canary]
cmd = ["bash", "/home/xanewok/repos/draft-attn/codex/draft-attn-probe3/run.sh", "--canary"]
env = { CUDA_VISIBLE_DEVICES = "0", BUDGET_S = "180", OUT = "/home/xanewok/repos/draft-attn/codex/runs/draft-attn-ab3/canary-a{attempt}" }
timeout_s = 240

[outputs]
paths = ["/home/xanewok/repos/draft-attn/codex/runs/draft-attn-ab3/full-a{attempt}"]

[fix]
editable = []
protected = ["frozen", "budget"]

