id = "k11b-nsys"
priority = 18
host_sensitive = false
note = "why: K11b single staging copy, slowest link first: does the GPU1 start lag at V->C0 and D5->V (x2: 75.7/73.1 us) fall below 40 us and the block span shrink by >= 40 us | expect: shared and sharedfwd remove the second host memcpy (memcpy gap before MB1 ~0), shared also starts GPU1's chain first (D, G) | falsifier: lag stays > 40 us, or span does not shrink >= 40 us; base2 vs base gives the same-arm spread | answers: whether pkg K11b engages and moves the big boundaries on stack10-cand"
title = "K11b: s10-k11b CUDA build (stack10-cand + shared staging copy), Swift 1.5 IQ4_XS np2 serving -duo shape (-np 2, -c 204800, ub 512, chain and fold C off), decode-8k with both slots decoding, nsys CUDA trace, five arms booted in turn: base (per-rank copies), shared (one copy, measured slowest link first), sharedfwd (one copy, rank 0 first), s1rev (per-rank copies, last rank first), base2 (repeat of base); within-trace boundary metrics, mechanism capture, no timing verdict"
kind = "measure"
budget_s = 2500
est_s = 700
ab = false
retry = "fresh"
startup_grace_s = 600
exit_codes = { "3" = "hazard", "4" = "transient", "5" = "insufficient_data", "6" = "integrity", "7" = "timeout", "8" = "deterministic" }
signatures = [
  { class = "integrity", regex = "frozen corpus/template/client changed|draft vocab changed|model missing or wrong size|no CUDA build|build-cuda does not match|kv_pad proof failed|ub proof failed|AR dual-stream proof failed|cand-neginf proof failed|CPU sampler warning|chain/fold engaged at np2|K11b env proof failed|K11b engagement proof failed|K11b order proof failed|proof response" },
  { class = "insufficient_data", regex = "window did not close|request ended before the window|a slot never produced a token|no report|no runs.json" },
]

