id = "mtp-fuse-depth-j5q"
title = "MTP catch-up fused into D1 + output-graph slots keyed by batch shape (frozen mtp-fuse b5cd0e5ad, LLAMA_MTP_FUSE_CATCHUP=1) vs stack4 590912a1d (eager); Swift 1.5 J5q TP2 np1 k=5 -ub 512, steady full-K ms/round at 8k/32k/90k; within-arm identity + 5-vs-6 draft forwards per round gates; acceptance-matched ms/round delta (primary), CUDA graph churn and VRAM report-only"
# up patch patch up: 4 x 420 s x 1.5 + 150 = run 2700; + canary 900 + cleanup 150 = 3750.
# cpu_evidence: CPU -nr: fused vs eager 0/40 token differences (matrix T1); graph slots: graph-results f{0,1}-s{2,12}
kind = "measure"
ab = true
retry = "fresh"
budget_s = 3750
est_s = 2000
startup_grace_s = 300
exit_codes = { "3" = "hazard", "4" = "transient", "5" = "insufficient_data", "6" = "integrity", "7" = "timeout", "8" = "deterministic" }
signatures = [
  { class = "hazard", regex = "\\bXid\\b|fallen off the bus" },
  { class = "integrity", regex = "frozen bytes changed|inputs changed|model SHA changed|effective params mismatch|frozen file set changed|cross-arm identity failed|path-engaged proof failed|staging-engaged proof failed|canary prompt differs" },
  { class = "insufficient_data", regex = "too few verify steps|proof inconclusive|missing final token identity|canary prompt has \\d+ tokens|reached only \\d+ cached|R2 reused only" },
]

[run]
cmd = ["bash", "/home/xanewok/repos/qwen38-eval-worktrees/wt/mtp-fuse-diag/codex/mtp_fuse_run.sh", "--execute", "--out", "/home/xanewok/repos/qwen38-eval/results/2026-10-05-mtp-fuse-depth-j5q/full-a{attempt}", "--port", "{port}"]
cwd = "/home/xanewok/repos/qwen38-eval/harness"
env = { GPUQ_ACTIVE = "1" }
ports = "dynamic"

[preflight]
