  { class = "hazard", regex = "\\bXid\\b|fallen off the bus" },
  { class = "insufficient_data", regex = "mutant passed|not caught by" },
  { class = "timeout", regex = "budget expired|hung \\(900 s\\)" },
  { class = "deterministic", regex = "bw-s9-gdn4: FAIL" },
]

