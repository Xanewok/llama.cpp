id = "bw-s9-gdn4"
title = "stack9 + #30087 GDN four columns per warp: CUDA build, test-backend-ops on both GPUs with must-fail mutants, spill gate, kernel perf vs stack9, freeze stack9-gdn4; Mac CPU gates required"
kind = "filler"
priority = 18
host_sensitive = false
preemptible = false
# G: build ~25 min (ccache warm), test build + 5 one-TU variants ~25 min, correctness ~5 min, perf 2 GPUs x 4 ABBA rounds ~10 min, freeze ~1 min, item render ~1 min.
# D: budget = estimate x 2. The payload stops itself at 8000 s.
est_s = 4500
budget_s = 9000
ab = false
retry = "never"
exit_codes = { "3" = "hazard", "4" = "transient", "5" = "insufficient_data", "6" = "integrity", "7" = "timeout", "8" = "deterministic" }
