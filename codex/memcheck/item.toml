id = "gdn-indexed-memcheck"
title = "GPU0 sanitizer gates: GATED_DELTA_NET and GATED_DELTA_NET_INDEXED memcheck, indexed racecheck/synccheck"
# Canary: the smallest indexed case (head_size=16, n_seqs=1) under memcheck, <= 90 s.
# Full caps: 240 + 90 + 90 + 90 = 510 s (D), <= 0.85 x 600 s run budget (D); budget_s covers preflight 120 + canary 360 + run 600 + margin.
priority = 90
kind = "measure"
budget_s = 1150
est_s = 330
ab = false
retry = "fresh"
exit_codes = { "3" = "hazard", "4" = "transient", "5" = "insufficient_data", "6" = "integrity", "7" = "timeout", "8" = "deterministic" }
signatures = [
  { class = "integrity", regex = "probe: integrity" },
  { class = "timeout", regex = "probe: budget" },
]

[run]
cmd = ["python3", "/home/xanewok/repos/qwen38-eval-worktrees/wt/gdn-gather-inplace/codex/memcheck/memcheck.py", "--run"]
cwd = "/home/xanewok/repos/qwen38-eval-worktrees/wt/gdn-gather-inplace/codex/memcheck"
env = { CUDA_VISIBLE_DEVICES = "GPU-ee9a3956-297c-604b-b4c1-f07930d27e46", BUDGET_S = "600", OUT = "/home/xanewok/repos/qwen38-eval/results/2026-10-06-gdn-indexed-memcheck/a{attempt}", RAW = "/mnt/scratch/work/gdn-indexed-memcheck/a{attempt}" }
