[preflight]
cmd = ["python3", "/home/xanewok/repos/qwen38-eval-worktrees/wt/gdn-gather-inplace/codex/memcheck/memcheck.py", "--preflight"]
timeout_s = 120

[canary]
cmd = ["python3", "/home/xanewok/repos/qwen38-eval-worktrees/wt/gdn-gather-inplace/codex/memcheck/memcheck.py", "--canary"]
env = { CUDA_VISIBLE_DEVICES = "GPU-ee9a3956-297c-604b-b4c1-f07930d27e46", BUDGET_S = "300", OUT = "/home/xanewok/repos/qwen38-eval/results/2026-10-06-gdn-indexed-memcheck/canary-a{attempt}", RAW = "/mnt/scratch/work/gdn-indexed-memcheck/canary-a{attempt}" }
