id = "stack3-identity"
title = "Swift S5 np2: stack2 vs stack3 defaults vs staged inputs, exact output gate"
kind = "measure"
ab = true
retry = "fresh"
budget_s = 1200
est_s = 780
startup_grace_s = 90
signatures = [
  { class = "hazard", regex = "\\bXid\\b|fallen off the bus" },
  { class = "timeout", regex = "queue wall budget" },
  { class = "integrity", regex = "identity failed|frozen.*changed|inputs changed|model SHA changed" },
  { class = "insufficient_data", regex = "insufficient steady|generated length|did not stream|missing authoritative rounds|did not overlap" },
  { class = "deterministic", regex = "boot validation failed|aggregate counters disagree|prompt size/cache gate failed" },
]

[run]
cmd = ["bash", "/home/xanewok/repos/stack3/codex/gpu_ab.sh", "--execute", "--budget", "960", "--port", "8403", "--out", "/home/xanewok/repos/stack3/codex/runs/stack3-identity/full-a{attempt}"]
cwd = "/home/xanewok/repos/stack3"
env = { RUN_GPU = "1" }
ports = [8403]

[preflight]
cmd = ["bash", "/home/xanewok/repos/stack3/codex/gpu_ab.sh", "--budget", "960", "--port", "8403"]
cwd = "/home/xanewok/repos/stack3"
env = {}
timeout_s = 120

[canary]
cmd = ["bash", "/home/xanewok/repos/stack3/codex/gpu_ab.sh", "--execute", "--canary", "--budget", "240", "--port", "8403", "--out", "/home/xanewok/repos/stack3/codex/runs/stack3-identity/canary-a{attempt}"]
cwd = "/home/xanewok/repos/stack3"
env = { RUN_GPU = "1" }
timeout_s = 240

[outputs]
paths = ["/home/xanewok/repos/stack3/codex/runs/stack3-identity"]

[fix]
editable = []
protected = ["identity", "minimum_steady_rounds", "768", "SHA256SUMS", "32768"]

